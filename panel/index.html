<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo studio</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      // Before the first paint: the window says light or dark in the query.
      if (new URLSearchParams(location.search).get("theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <h1>Demo studio</h1>
        <div class="new">
          <input id="new-title" type="text" placeholder="Title of a new video" aria-label="Title of a new video" />
          <select id="new-product" aria-label="Product">
            <option value="odi">Artemis (ODI)</option>
            <option value="prifly">prifly</option>
          </select>
          <button id="new-video" type="button" disabled>New video</button>
        </div>
        <ul id="videos" class="videos"></ul>
        <p id="videos-note" class="muted"></p>
      </aside>
      <main class="main">
        <p id="error" class="error" hidden></p>
        <p id="notice" class="notice" hidden></p>
        <nav class="tabs" id="tabs">
          <button type="button" data-tab="brief">1 Brief</button>
          <button type="button" data-tab="script">2 Script</button>
          <button type="button" data-tab="storyboard">3 Storyboard</button>
          <button type="button" data-tab="video">4 Video</button>
        </nav>
        <section id="body" class="body"></section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
